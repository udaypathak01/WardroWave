openapi: 3.0.3
info:
  title: WardroWave Rental API
  version: 1.0.0
  description: >-
    API for browsing, quoting, and booking fashion rentals. JSON success
    responses use { success: true, data, meta? }; JSON errors use
    { success: false, error: { code, message, details? } }. Request correlation
    is provided by the X-Request-Id response header.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Authentication
  - name: Contact
  - name: Catalog
  - name: Cart
  - name: Bookings
  - name: Payments
  - name: Webhooks
  - name: Users
  - name: Staff
  - name: Admin
paths:
  /contact:
    post:
      tags: [Contact]
      summary: Submit a message to customer support
      description: Queues the validated message for delivery through the email outbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessageRequest'
      responses:
        '202':
          description: Message accepted for delivery.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [accepted]
                        properties:
                          accepted: { type: boolean, enum: [true] }
        '400':
          description: Contact message validation failed.
        '429':
          description: Contact submission rate limit exceeded.
  /categories:
    get:
      tags: [Catalog]
      summary: List active categories
      responses:
        '200':
          description: Active category tree.
  /products:
    get:
      tags: [Catalog]
      summary: Search published rental products
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: occasion
          schema: { type: string }
        - in: query
          name: gender
          schema: { type: string, enum: [women, men, unisex, kids] }
        - in: query
          name: size
          schema: { type: string }
        - in: query
          name: color
          schema: { type: string }
        - in: query
          name: brand
          schema: { type: string }
        - in: query
          name: minPrice
          schema: { type: integer, minimum: 0 }
        - in: query
          name: maxPrice
          schema: { type: integer, minimum: 0 }
        - in: query
          name: available
          schema: { type: boolean }
        - in: query
          name: startDate
          schema: { type: string, format: date }
        - in: query
          name: endDate
          schema: { type: string, format: date }
        - in: query
          name: sort
          schema: { type: string, enum: [newest, price_asc, price_desc, popular, rating] }
      responses:
        '200':
          description: Product cards, facet counts and pagination metadata.
  /products/featured:
    get:
      tags: [Catalog]
      summary: List featured products
      responses:
        '200':
          description: Featured product cards.
  /products/{slug}:
    get:
      tags: [Catalog]
      summary: Get a product by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product detail, variants, size chart and rating summary.
        '404':
          description: Product not found.
  /products/{slug}/availability:
    get:
      tags: [Catalog]
      summary: Get blocked dates and optional availability for a product variant
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: query
          name: variantId
          required: true
          schema: { type: string }
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
        - in: query
          name: startDate
          schema: { type: string, format: date }
        - in: query
          name: endDate
          schema: { type: string, format: date }
      responses:
        '200':
          description: Blocked calendar ranges and optional free-unit count.
  /products/{slug}/reviews:
    get:
      tags: [Catalog]
      summary: List approved product reviews
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reviews with rating histogram and fit-feedback summary.
  /products/{slug}/similar:
    get:
      tags: [Catalog]
      summary: List similar products
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Published products from the same category and occasions.
  /pincodes/{pincode}/serviceable:
    get:
      tags: [Catalog]
      summary: Check delivery serviceability
      parameters:
        - in: path
          name: pincode
          required: true
          schema: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Serviceability and estimated delivery time.
  /health:
    servers:
      - url: /
    get:
      tags: [Health]
      summary: Check process liveness
      responses:
        '200':
          description: Process liveness in the standard success envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /health/ready:
    servers:
      - url: /
    get:
      tags: [Health]
      summary: Check database readiness
      responses:
        '200':
          description: MongoDB is available in the standard success envelope.
        '503':
          description: MongoDB is unavailable in the standard error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /meta/config:
    servers:
      - url: /
    get:
      tags: [Health]
      summary: Get public storefront configuration
      responses:
        '200':
          description: Public rental settings and payment configuration.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RentalStorefrontConfig'
  /api/v1/meta/config:
    servers:
      - url: /
    get:
      tags: [Health]
      summary: Get public storefront configuration
      responses:
        '200':
          description: Public rental settings and payment configuration.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RentalStorefrontConfig'
  /cart:
    get:
      tags: [Cart]
      summary: Get the authenticated user's cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart items and coupon.
    delete:
      tags: [Cart]
      summary: Clear the authenticated user's cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart cleared.
  /cart/items:
    post:
      tags: [Cart]
      summary: Add a rental variant and date range to the cart
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Cart updated.
  /cart/items/{itemId}:
    delete:
      tags: [Cart]
      summary: Remove a cart item
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cart updated.
  /cart/coupon:
    patch:
      tags: [Cart]
      summary: Apply or remove a coupon code
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart coupon updated.
  /wishlist:
    get:
      tags: [Users]
      summary: Get the authenticated user's wishlist
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wishlist products.
  /wishlist/{productId}:
    post:
      tags: [Users]
      summary: Add a product to the wishlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Wishlist updated.
    delete:
      tags: [Users]
      summary: Remove a product from the wishlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Wishlist updated.
  /auth/sync:
    post:
      tags: [Authentication]
      summary: Synchronize a Firebase identity authenticated with a valid ID token
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                phone: { type: string, pattern: '^\\+91[0-9]{10}$' }
      responses:
        '200':
          description: User profile synchronized.
        '403':
          description: The account is blocked.
        '410':
          description: The account has been deleted.
  /catalog/products:
    get:
      tags: [Catalog]
      summary: List published products
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Product list and pagination metadata.
  /catalog/prerender/products:
    get:
      tags: [Catalog]
      summary: List bounded published product details for static storefront builds
      description: This public, paginated endpoint includes variants and does not increment product views.
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: Published product details and variants with pagination metadata.
  /catalog/categories:
    get:
      tags: [Catalog]
      summary: List active product categories
      responses:
        '200':
          description: Active categories for catalog navigation.
  /catalog/products/{slug}:
    get:
      tags: [Catalog]
      summary: Get a published product
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product details.
        '404':
          description: Product not found.
  /catalog/products/{productId}/reviews:
    get:
      tags: [Catalog]
      summary: List approved product reviews
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Approved reviews and pagination metadata.
    post:
      tags: [Catalog]
      summary: Review a product rented in a completed booking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bookingId, rating, title, comment]
              properties:
                bookingId: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string }
                comment: { type: string }
                fitFeedback: { type: string }
                images:
                  type: array
                  maxItems: 3
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Review submitted for moderation.
  /users/me/avatar:
    post:
      tags: [Users]
      summary: Replace the authenticated user's avatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded and profile updated.
        '400':
          description: File type, content, or size is invalid.
  /users/me/wardrobe:
    get:
      tags: [Users]
      summary: List the authenticated user's wardrobe images
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user's uploaded wardrobe images, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WardrobeImage'
    post:
      tags: [Users]
      summary: Upload an image to the authenticated user's wardrobe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP; maximum size 5 MiB.
      responses:
        '201':
          description: Wardrobe image uploaded and saved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WardrobeImage'
        '400':
          description: File type, image content, or request is invalid.
        '413':
          description: Image exceeds the 5 MiB upload limit.
        '429':
          description: Upload rate limit exceeded.
  /users/me/wardrobe/{imageId}:
    delete:
      tags: [Users]
      summary: Delete an image from the authenticated user's wardrobe
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: imageId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Wardrobe image deleted.
        '404':
          description: Wardrobe image not found for the authenticated user.
  /admin/products/{productId}/images:
    post:
      tags: [Admin]
      summary: Upload product images
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  maxItems: 8
                  items: { type: string, format: binary }
      responses:
        '200':
          description: Images uploaded and attached to the product.
    patch:
      tags: [Admin]
      summary: Reorder product images and set the primary image
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicIds, primaryPublicId]
              properties:
                publicIds:
                  type: array
                  items: { type: string }
                primaryPublicId:
                  type: string
      responses:
        '200':
          description: Product image order updated.
    delete:
      tags: [Admin]
      summary: Remove a product image
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicId]
              properties:
                publicId: { type: string }
      responses:
        '200':
          description: Product image removed and Cloudinary deletion attempted.
  /admin/products/{productId}/upload-signature:
    post:
      tags: [Admin]
      summary: Get signed parameters for direct product image upload
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Short-lived Cloudinary upload signature.
  /cart/quote:
    post:
      tags: [Cart]
      summary: Calculate a server-priced rental quote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: Per-item availability and paise pricing breakdown.
  /bookings/quote:
    post:
      tags: [Bookings]
      summary: Calculate a checkout quote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: Per-item availability and paise pricing breakdown.
  /bookings:
    get:
      tags: [Bookings]
      summary: List the authenticated customer's bookings
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: A page of the authenticated customer's bookings.
    post:
      tags: [Bookings]
      summary: Create a booking and place rental holds
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressId]
              properties:
                addressId: { type: string }
                couponCode: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [variantId, startDate, endDate]
                    properties:
                      variantId: { type: string }
                      startDate: { type: string, format: date }
                      endDate: { type: string, format: date }
      responses:
        '201':
          description: Pending booking and Razorpay order.
        '409':
          description: Rental unit is no longer available.
  /bookings/{id}:
    get:
      tags: [Bookings]
      summary: Get an owned booking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Booking details.
        '404':
          description: Booking not found.
  /bookings/{id}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel an eligible booking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cancellation and refund result.
  /bookings/{id}/return:
    post:
      tags: [Bookings]
      summary: Request a return pickup for a delivered booking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickupAt]
              properties:
                pickupAt: { type: string, format: date-time }
      responses:
        '200':
          description: Return pickup request recorded.
        '409':
          description: Booking is not in the delivered state.
  /bookings/{id}/invoice:
    get:
      tags: [Bookings]
      summary: Download a confirmed booking invoice
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invoice PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '409':
          description: Invoice is unavailable until payment is confirmed.
  /users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile.
    patch:
      tags: [Users]
      summary: Update the authenticated user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated user profile.
    delete:
      tags: [Users]
      summary: Soft-delete the authenticated user account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deletion confirmation.
        '409':
          description: Active bookings prevent account deletion.
  /users/me/notifications:
    get:
      tags: [Users]
      summary: List the authenticated user's notifications
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Notifications and the next keyset cursor.
  /users/me/notifications/{notificationId}/read:
    patch:
      tags: [Users]
      summary: Mark an owned notification as read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated notification.
  /admin/users/{id}/access:
    patch:
      tags: [Admin]
      summary: Change a user's role or account state
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated access and audit record. Role changes require recent authentication, superadmin role, and MFA when enabled.
        '401':
          description: Recent authentication is required. The error code is REAUTH_REQUIRED.
        '403':
          description: Superadministrator access is required for role changes or administrator account status changes; MFA_REQUIRED indicates a missing second-factor claim.
  /admin/users/{id}:
    delete:
      tags: [Admin]
      summary: Anonymize a customer account
      description: Requires recent authentication. Administrator and staff accounts must instead be disabled through the access-management flow, which requires superadmin authorization and MFA when enabled.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Account anonymized, Firebase identity removed, and audit record written.
        '401':
          description: Recent authentication is required. The error code is REAUTH_REQUIRED.
        '409':
          description: Account has an active booking or is not a customer account.
  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Read administrator dashboard totals
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Booking, customer, product, inventory, and review totals with recent bookings.
  /admin/bookings:
    get:
      tags: [Admin]
      summary: List bookings for administration
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: q, description: Booking number search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: userId, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200':
          description: Paginated bookings with limited customer contact details.
        '400':
          description: Invalid filters.
  /admin/bookings/{id}:
    get:
      tags: [Admin]
      summary: Read booking details for administration
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Booking, fulfillment timeline, item, and customer details.
        '404':
          description: Booking not found.
  /admin/customers:
    get:
      tags: [Admin]
      summary: List customer and staff accounts
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: q, description: Name, email, or phone search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: role, schema: { type: string, enum: [customer, staff, admin, superadmin] } }
        - { in: query, name: status, schema: { type: string, enum: [active, blocked] } }
      responses:
        '200':
          description: Paginated account list with minimal contact data.
  /admin/customers/{id}:
    get:
      tags: [Admin]
      summary: Read customer account details
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Customer contact and address data with recent bookings.
        '404':
          description: Customer not found.
  /admin/products:
    get:
      tags: [Admin]
      summary: List all catalog products, including drafts and archived products
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
