components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    RentalStorefrontConfig:
      type: object
      required:
        - minRentalDays
        - maxRentalDays
        - minLeadDays
        - maxAdvanceDays
        - gstPercent
        - deliveryFee
        - freeDeliveryAbove
        - freeCancelHours
        - cancellationPolicy
        - razorpayKeyId
        - supportEmail
      properties:
        minRentalDays: { type: integer, minimum: 1 }
        maxRentalDays: { type: integer, minimum: 1 }
        minLeadDays: { type: integer, minimum: 0 }
        maxAdvanceDays: { type: integer, minimum: 1 }
        gstPercent: { type: number, minimum: 0 }
        deliveryFee: { type: integer, minimum: 0 }
        freeDeliveryAbove: { type: integer, minimum: 0 }
        freeCancelHours: { type: integer, minimum: 0 }
        cancellationPolicy: { type: string }
        razorpayKeyId: { type: string, nullable: true }
        supportEmail: { type: string, format: email }
    ContactMessageRequest:
      type: object
      additionalProperties: false
      required: [name, email, subject, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 20 }
        subject: { type: string, minLength: 1, maxLength: 160 }
        message: { type: string, minLength: 1, maxLength: 5000 }
    WardrobeImage:
      type: object
      required: [_id, url, width, height, bytes, format, createdAt]
      properties:
        _id: { type: string }
        url: { type: string, format: uri }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        bytes: { type: integer, minimum: 1 }
        format: { type: string, enum: [jpeg, png, webp] }
        createdAt: { type: string, format: date-time }
    ApiSuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data: {}
        meta:
          type: object
          additionalProperties: true
    ApiErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/ValidationIssue'
                - type: object
                  additionalProperties: true
    ValidationIssue:
      type: object
      required: [path, message]
      properties:
        path: { type: string }
        message: { type: string }
    QuoteRequest:
      type: object
      required: [items, pincode]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [variantId, startDate, endDate]
            properties:
              variantId: { type: string }
              startDate: { type: string, format: date }
              endDate: { type: string, format: date }
        couponCode: { type: string }
        pincode: { type: string, pattern: '^\d{6}$' }
